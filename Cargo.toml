[package]
name = "pay-kit"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Payment webhooks to settled ledger entries — Stripe and GoCardless signature verification via webhookkit, settlements posted through double-entry"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/pay-kit"
keywords = ["payments", "stripe", "gocardless", "accounting", "webhooks"]
categories = ["finance", "api-bindings"]

[dependencies]
webhookkit = "=1.1.2"
invoice-kit = "=1.1.0"
double-entry = "=0.1.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
hmac = { version = "0.12", default-features = false }
sha2 = { version = "0.10", default-features = false }
hex = "0.4"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
